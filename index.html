<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Louie Apolinario, Product Designer &amp; Computer Engineer</title>
    <meta name="description" content="Louie Apolinario is a product designer and computer engineer who designs digital products and writes the code that ships them." />

    <!-- Link previews (LinkedIn, Slack, X). Once the site has its final domain,
         make og:image absolute, e.g. https://your-domain.com/og.png -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Louie Apolinario, Product Designer &amp; Computer Engineer" />
    <meta property="og:description" content="Design and front-end engineering for SaaS dashboards, onboarding, and mobile apps." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Vercel Web Analytics (cookie-free). Only loads on the deployed site. -->
    <script>
      if (!/^(localhost|127\.|192\.168\.)/.test(location.hostname)) {
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments) }
        const s = document.createElement('script')
        s.defer = true
        s.src = '/_vercel/insights/script.js'
        document.head.appendChild(s)
      }
    </script>

    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch { document.documentElement.dataset.theme = 'light' }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist:wght@400..600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
